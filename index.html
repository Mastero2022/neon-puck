<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Neon Puck | Telegram Mini App</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">
	<script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
      /* Piespiežam spēlei aizņemt visu ekrānu bez malām */
      html, body { 
        margin: 0; 
        padding: 0; 
        width: 100%; 
        height: 100%; 
        overflow: hidden; 
        background-color: #000; 
      }
      #unity-container { 
        width: 100vw; 
        height: 100vh; 
      }
      canvas { 
        width: 100% !important; 
        height: 100% !important; 
        display: block;
      }
      /* Centrējam ielādes joslu */
      #unity-loading-bar {
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        display: none;
      }
    </style>
  </head>
  <body>
    <div id="unity-container">
      <canvas id="unity-canvas" tabindex="-1"></canvas>
      <div id="unity-loading-bar">
        <div id="unity-logo"></div>
        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
      </div>
      <div id="unity-warning"> </div>
    </div>

	<script>
      var canvas = document.querySelector("#unity-canvas");

      function unityShowBanner(msg, type) {
        var warningBanner = document.querySelector("#unity-warning");
        function updateBannerVisibility() {
          warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
        }
        var div = document.createElement('div');
        div.innerHTML = msg;
        warningBanner.appendChild(div);
        if (type == 'error') div.style = 'background: red; padding: 10px;';
        else {
          if (type == 'warning') div.style = 'background: yellow; padding: 10px;';
          setTimeout(function() {
            warningBanner.removeChild(div);
            updateBannerVisibility();
          }, 5000);
        }
        updateBannerVisibility();
      }

      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/Neon_Puck.loader.js";
      var config = {
        arguments: [],
        dataUrl: buildUrl + "/Neon_Puck.data.unityweb",
        frameworkUrl: buildUrl + "/Neon_Puck.framework.js.unityweb",
        codeUrl: buildUrl + "/Neon_Puck.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "MasteroGames",
        productName: "Neon Puck",
        productVersion: "1.0",
        showBanner: unityShowBanner,
      };

      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
        var meta = document.createElement('meta');
        meta.name = 'viewport';
        meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';
        document.getElementsByTagName('head')[0].appendChild(meta);
      }

      document.querySelector("#unity-loading-bar").style.display = "block";

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => {
        createUnityInstance(canvas, config, (progress) => {
          document.querySelector("#unity-progress-bar-full").style.width = 100 * progress + "%";
        }).then((unityInstance) => {
          document.querySelector("#unity-loading-bar").style.display = "none";
          
          if (window.Telegram && window.Telegram.WebApp) {
              const webApp = window.Telegram.WebApp;
              webApp.ready();
              webApp.expand(); // Paplašina aplikāciju pa visu ekrānu

			const user = webApp.initDataUnsafe.user;

			if (user) {
				const userId = user.id.toString();
				
				// Apvienojam vārdu un uzvārdu, ja uzvārds eksistē
				let fullName = user.first_name || "";
				if (user.last_name) {
					fullName += " " + user.last_name;
				}
				
				// Ja abi ir tukši (reti gadījumi), izmantojam username vai "Player"
				if (fullName.trim() === "") {
					fullName = user.username || "Player";
				}

				// 1. Nosūtām ID
				unityInstance.SendMessage('CloudSaveManager', 'SetTelegramID', userId);

				// 2. Nosūtām apvienoto vārdu
				//unityInstance.SendMessage('CloudSaveManager', 'SetTelegramName', fullName);
    

                  // 3. Pārbaudām Referral (vai draugs uzaicināja)
                  const startParam = webApp.initDataUnsafe.start_param;
                  if (startParam && startParam.startsWith('ref_')) {
                      const referrerId = startParam.replace('ref_', '');
                      unityInstance.SendMessage('CloudSaveManager', 'SetReferrerID', referrerId);
                  }
              }
          }
        }).catch((message) => {
          alert(message);
        });
      };

      document.body.appendChild(script);
      
      // Funkcija draugu uzaicināšanai
      function shareInviteLink(link) {
          const shareUrl = 'https://t.me/share/url?url=' + encodeURIComponent(link) + '&text=' + encodeURIComponent('Join me for a game of Neon Puck air hockey! 🏒');
          if (window.Telegram && window.Telegram.WebApp) {
              window.Telegram.WebApp.openTelegramLink(shareUrl);
          } else {
              window.open(shareUrl, '_blank');
          }
      }
    </script>
  </body>
</html>
