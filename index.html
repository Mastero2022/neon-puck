<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Neon Puck | Telegram Mini App</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
      /* Piespiežam spēlei aizņemt visu ekrānu bez malām */
      html, body { 
        margin: 0; 
        padding: 0; 
        width: 100%; 
        height: 100%; 
        overflow: hidden; 
        background-color: #000; 
      }
      #unity-container { 
        width: 100vw; 
        height: 100vh; 
      }
      canvas { 
        width: 100% !important; 
        height: 100% !important; 
        display: block;
      }
      /* Centrējam ielādes joslu */
      #unity-loading-bar {
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        display: none;
      }
    </style>
  </head>
  <body>
    <div id="unity-container">
      <canvas id="unity-canvas" tabindex="-1"></canvas>
      <div id="unity-loading-bar">
        <div id="unity-logo"></div>
        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
      </div>
      <div id="unity-warning"> </div>
    </div>

    <script>
      var canvas = document.querySelector("#unity-canvas");
      // 1. IZMAIŅA: Padarām unityInstance pieejamu globāli
      var myUnityInstance = null; 

      function unityShowBanner(msg, type) {
        var warningBanner = document.querySelector("#unity-warning");
        function updateBannerVisibility() {
          warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
        }
        var div = document.createElement('div');
        div.innerHTML = msg;
        warningBanner.appendChild(div);
        if (type == 'error') div.style = 'background: red; padding: 10px;';
        else {
          if (type == 'warning') div.style = 'background: yellow; padding: 10px;';
          setTimeout(function() {
            warningBanner.removeChild(div);
            updateBannerVisibility();
          }, 5000);
        }
        updateBannerVisibility();
      }

      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/Neon_Puck.loader.js";
      var config = {
        arguments: [],
        dataUrl: buildUrl + "/Neon_Puck.data.unityweb",
        frameworkUrl: buildUrl + "/Neon_Puck.framework.js.unityweb",
        codeUrl: buildUrl + "/Neon_Puck.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "MasteroGames",
        productName: "Neon Puck",
        productVersion: "1.0",
        showBanner: unityShowBanner,
      };

      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
        var meta = document.createElement('meta');
        meta.name = 'viewport';
        meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';
        document.getElementsByTagName('head')[0].appendChild(meta);
      }

      document.querySelector("#unity-loading-bar").style.display = "block";

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => {
        createUnityInstance(canvas, config, (progress) => {
          document.querySelector("#unity-progress-bar-full").style.width = 100 * progress + "%";
        }).then((unityInstance) => {
          // Saglabājam instanci globālajā mainīgajā
          myUnityInstance = unityInstance; 
          document.querySelector("#unity-loading-bar").style.display = "none";
          
          if (window.Telegram && window.Telegram.WebApp) {
              const webApp = window.Telegram.WebApp;
              webApp.ready();
              webApp.expand(); 

            const user = webApp.initDataUnsafe.user;

            if (user) {
                const userId = user.id.toString();
                
                let fullName = user.first_name || "";
                if (user.last_name) {
                    fullName += " " + user.last_name;
                }
                
                if (fullName.trim() === "") {
                    fullName = user.username || "Player";
                }

                // Sūtām ID uz Unity
                myUnityInstance.SendMessage('CloudSaveManager', 'SetTelegramID', userId);

                // Pārbaudām Referral
                const startParam = webApp.initDataUnsafe.start_param;
                if (startParam && startParam.startsWith('ref_')) {
                    const referrerId = startParam.replace('ref_', '');
                    myUnityInstance.SendMessage('CloudSaveManager', 'SetReferrerID', referrerId);
                }
            }
          }
        }).catch((message) => {
          alert(message);
        });
      };

      document.body.appendChild(script);
      
      // Funkcija draugu uzaicināšanai
      function shareInviteLink(link) {
          const shareUrl = 'https://t.me/share/url?url=' + encodeURIComponent(link) + '&text=' + encodeURIComponent('Join me for a game of Neon Puck air hockey! 🏒');
          if (window.Telegram && window.Telegram.WebApp) {
              window.Telegram.WebApp.openTelegramLink(shareUrl);
          } else {
              window.open(shareUrl, '_blank');
          }
      }

      // 2. IZMAIŅA: Funkcija, ko izsauc tavs ShopUI C# skripts
      function PassPurchaseToTelegram(starsAmount) {
          if (myUnityInstance !== null) {
              // Izsaucam CloudSaveManager metodi un padodam līdzi Stars daudzumu
              myUnityInstance.SendMessage('CloudSaveManager', 'RequestInvoiceFromJS', starsAmount);
          } else {
              console.error("Unity instance vēl nav ielādējusies!");
          }
      }

      // 3. IZMAIŅA: Funkcija, kas atver reālo Telegram Stars pirkuma logu
      function triggerTelegramInvoice(starAmount, playFabId) {
          if (window.Telegram && window.Telegram.WebApp) {
              window.Telegram.WebApp.openInvoice({
                  title: "Pucks Pack",
                  description: "Papildini savu PUCKS bilanci spēlē!",
                  currency: "XTR", // XTR ir oficiālais Telegram Stars kods
                  prices: [{ label: "Stars", amount: parseInt(starAmount) }],
                  payload: playFabId.toString() // Nododam spēlētāja PlayFabID tavam Render botam
              }, function(status) {
                  if (status === 'paid') {
                      console.log("Maksājums veikts! Gaidām, kad bots apstrādās datus...");
                      
                      // Iedodam 1.5 sekundi botam pabeigt komunikāciju ar PlayFab
                      setTimeout(function() {
                          if (myUnityInstance !== null) {
                              // Paziņojam Unity, ka laiks atjaunot bilances UI
                              myUnityInstance.SendMessage('CloudSaveManager', 'OnPaymentSuccess', 'success');
                          }
                      }, 1500);
                  } else {
                      console.log("Maksājums atcelts vai neizdevās. Statuss: " + status);
                  }
              });
          } else {
              console.error("Telegram WebApp nav atrasts! Pirkums nav iespējams.");
          }
      }
    </script>
  </body>
</html>
